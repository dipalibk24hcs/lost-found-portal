<!DOCTYPE html>
<html>
<head>
    <title>Report Lost Item</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
    <h1>Report Lost Item</h1>
</header>

<form id="lostForm">

    <input type="text" id="lostTitle"
    placeholder="Item Name" required>

    <input type="text" id="lostCategory"
    placeholder="Category" required>

    <input type="text" id="lostLocation"
    placeholder="Location" required>

    <textarea id="lostDescription"
    placeholder="Description">
    </textarea>

    <label for="lostImage">
    Upload Item Image
</label>

<input
    type="file"
    id="lostImage"
    accept="image/*"
>

    <button type="submit">
        Submit Lost Item
    </button>
    

</form>

<script src="script.js"></script>

</body>
</html>
